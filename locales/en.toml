# ---- core ----
# core: crates/cc-config/src/lib.rs, crates/cc-room/src/lib.rs, crates/cc-joints/src/*.rs, crates/cc-generate/src/*.rs

# Validation of the job, materials, standard, catalog and machine profile (cc-config)
[config]
invalid = "{path}: invalid configuration:\n  - {problems}"
must_be_positive = "`{name}` must be > 0 (is {value})"
must_be_non_negative = "`{name}` must be ≥ 0 (is {value})"

[config.catalog]
too_many_items = "at most {max} items"
bad_id = "item without `id` or with a too long `id`"
duplicate = "`{id}` is in the catalog twice"
bad_size = "`{id}`: `{name}` must be positive, up to 10,000 mm"
too_many_fronts = "`{id}`: at most 12 fronts and 50 shelves"
bad_front_heights = "`{id}`: front heights and `drawer_length` must be positive"

[config.machine]
min_part_too_big = "`min_part` is larger than `work_area`"
no_drills = "`drills.diameters` is empty"
bad_drill = "`drills.diameters`: diameter must be > 0 (is {value})"
nesting_needs_nesting = "production.mode = \"nesting\" requires the [nesting] section (sheet programs)"
nesting_needs_xcs = "production.mode = \"nesting\" requires the [xcs] section (CX100 programs for the remaining work)"

# Machine profile templates and numbers ([xcs], [mpr], [nesting]); {block} and {name} are paths in machine.toml
[config.template]
unmatched_open = "{block}: unmatched `{{` in template `{template}`"
unmatched_close = "{block}: unmatched `}}` in template `{template}`"
unknown_variable = "{block}: unknown variable `{{{var}}}` (allowed: {allowed})"
no_variables = "none"
empty_field_name = "{block}: empty field name"
too_many_decimals = "{name}: max 6 (is {value})"
not_positive = "{name} must be > 0"
negative = "{name} must be ≥ 0"
empty = "{name} is empty"
step_over_kerf = "xcs.slot.max_step ({step}) is larger than saw_kerf ({kerf}): material would be left between passes"
sheet_name_vars = "nesting.sheet_name must contain `{{sheet}}` and `{{mat}}` or `{{material}}` (unique sheet names)"
sheet_size = "{name}: sheet size must be > 0 and ≤ {max} mm"
sheet_below_margins = "{name}: the sheet is smaller than two margins"
spacing_below_tool = "nesting.layout.spacing ({spacing}) must be ≥ the router bit diameter ({tool}): the bit would cut into the neighbouring part"
through_extra = "nesting.route.through_extra ({value}) is more than 2 mm into the spoil board"
lead_in_depth = "nesting.route.lead_in_depth must be < 0 (the lead-in starts above the material)"
overlap_below_tool = "nesting.route.overlap ({overlap}) must be ≥ the router bit diameter ({tool})"
remnant_offset = "nesting.remnant.offset ({offset}) must be > the router bit radius ({radius})"
remnant_overrun = "nesting.remnant.overrun ({overrun}) must be ≥ the router bit radius ({radius})"
