# CabinetCRAFT – English texts (reference file for translators).
#
# How to translate: copy this file to <language code>.toml (e.g. de.toml, pt-BR.toml),
# translate the texts in quotes and keep the keys (left of "=") unchanged.
# Keep {name} parameters as they are; they are replaced by numbers or names.
# Plural forms: { one = "...", few = "...", many = "...", other = "..." } – see locales/README.md.
# A key you leave out or leave empty falls back to English.

[meta]
name = "English"

