# Vzorová kuchyňa s miestnosťou (kap. 13): steny, okno, dvere a skrinky pri stenách.
# Steny sú kreslené v smere hodinových ručičiek, miestnosť je napravo od smeru steny.
[project]
name = "Dielna – kuchyňa s miestnosťou"
units = "mm"

[defaults]
panel_material = "DTDL_18_W960_biela"
back_material  = "HDF_3_biela"
construction   = "dielna-cx100"

[room]
wall_height = 2600
wall_thickness = 120
toe_height = 100        # nožičky: 100 + korpus 762 + doska 38 = 900
upper_top = 2200        # horná hrana horných skriniek = vrch vysokej skrinky

[[wall]]
id = "W1"               # zadná stena kuchyne
x = 0
y = 2800
length = 3600
angle = 0

[[wall]]
id = "W2"               # pravá stena
x = 3600
y = 2800
length = 2800
angle = -90

[[wall]]
id = "W3"
x = 3600
y = 0
length = 3600
angle = 180

[[wall]]
id = "W4"               # ľavá stena s dverami
x = 0
y = 0
length = 2800
angle = 90

[[opening]]
wall = "W1"
kind = "window"
at = 1250
width = 900
height = 1200
elevation = 1000

[[opening]]
wall = "W4"
kind = "door"
at = 1500
width = 900
height = 2000

