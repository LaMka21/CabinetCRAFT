# ]

[led_rail]                           # skrinka led_rail = { … }: doska pod hornou skrinkou
material = "MDF_19_W1000_biela"      # [P] 0058 „LED RAMPA“, 0065 „NES_LED RAMPA“: 19 MDF W1000
depth_minus = 20.0                   # [P] 0065: hĺbka 310 pri skrinke 330, zadnou hranou pri stene
# [P] 966b0065: 4 rezy LAMA (spolu šírka 14) hĺbky 13 zospodu na Z 266…280 od steny; 0058 frézou
#     FRESA2 Ø14 × 13 na Z 273; NES_Dno 71…85 od čela niky 351 – drážky sú v jednej línii
groove = { from_rear = 266.0, width = 14.0, depth = 13.0 }

[[joint_rule]]
