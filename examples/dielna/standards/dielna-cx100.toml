# [P] 9660502N (E008): Ø12 cez chrbát 18 od bokov, 60 a 110 od jeho vrchu (prístup k závesu).
#     Vypnuté: vrták Ø12 nie je v [drills] profilov stroja (nesting ho robí frézou E008), kontrola
