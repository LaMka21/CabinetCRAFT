# Profil stroja SCM CX100 + Maestro (kap. 7.4 špecifikácie).
#
# Formát [xcs] je prevzatý z programov, ktoré pre CX100 vyrábal CABINET VISION
# (zákazka REF2026, NESTING\CX100\*.xcs a RUN966.bat). Hodnoty work_area/min_part
# sú VZOR: treba ich nahradiť údajmi skutočného stroja.

[machine]
name = "SCM CX100 (Maestro) – dielna"

[work_area]
max_length = 3050.0     # VZOR – overiť
max_width = 1300.0      # VZOR – overiť

[min_part]
length = 200.0          # VZOR – overiť
width = 70.0            # VZOR – overiť

[drills]
# priemery použité vo vašich programoch CX100: 5, 8, 10
diameters = [5.0, 8.0, 10.0, 15.0, 20.0, 35.0]

# ---------------------------------------------------------------------------
# SCM Maestro .xcs
#
# Riadky sú šablóny; premenné v {zložených zátvorkách} (povolené sú pri každom bloku).
# Čísla v mm, s bodkou, max. `decimals` desatinných miest. Súbory sú ASCII s CRLF.
# verified = false → pred prvým rezom overiť na stroji; CLI na to upozorní.
# ---------------------------------------------------------------------------
[xcs]
decimals = 4
line_ending = "crlf"

# Premenné: {project} {part_id} {cabinet} {l} {w} {t}
header = [
    "//--PROJEKT: {project}",
    "//--DIEL: {part_id}  SKRINKA: {cabinet}",
    "//--Generovane z CabinetCRAFT",
    'SetMachiningParameters("J",1,70,84869121,false);',
    'CreateFinishedWorkpieceBox("Dilec",{l},{w},{t});',
    'SetWorkpieceSetupPosition(0,0, 0, 0);',
    'SetPreserveWorkingSequence(true);',
]
footer = []

# Roviny: F → Top, hrany X0/X1/Y0/Y1 → Left/Right/Front/Back.
# Lokálne x v bočnej rovine sa meria „pri pohľade zvonka“:
#   Back  = L − x  (potvrdené vzorom 966f0049),
#   Left  = W − y  (vzory sú symetrické → prevzaté z rovnakej konvencie, overiť: O1).
[xcs.workplanes]
select = 'SelectWorkplane("{plane}");'
top = "Top"
x0 = "Left"
x1 = "Right"
y0 = "Front"
y1 = "Back"
reverse_x0 = true
reverse_x1 = false
reverse_y0 = false
reverse_y1 = true

# Vŕtanie – formát presne podľa programov CV pre CX100.
[xcs.drill]
verified = true
name = "Vrtani {side}{n} DIA={d} Z={depth}"       # premenné: {side} {n} {d} {depth}
line = 'CreateDrill("{name}",{x},{y},{depth},{d},"",TypeOfProcess.Drilling,"-1","-1",0,"-1","-1","P",0,0.5);'

[xcs.drill.side_names]
top = ""
x0 = "Leva "
x1 = "Prava "
y0 = "Spodni "
y1 = "Horni "

# Drážka pílkou LAMA – formát podľa programov CV, šírka rezu 4 mm potvrdená.
[xcs.slot]
verified = true
name = "Pilka {n}"                                # premenná: {n}
first_number = 1001
saw_kerf = 4.0              # potvrdené používateľom (2026-10-16)
max_step = 3.4              # krok medzi prechodmi (z programov CV: 83 → 79.6 → 76.2 → 73)
through_extension = 60.0    # drážka cez celý diel: −60 … L+60 (z programov CV)
# Premenné: {name} {xs} {ys} {xe} {ye} {depth}
lines = [
    'CreateSegment("",{xs},{ys},{xe},{ye});',
    'ResetPneumaticHood();',
    'ResetAuxiliaryHood();',
    'CreateSlot("{name}",{depth},"", TypeOfProcess.GeneralRouting ,"LAMA","-1",3,4,0,0,0,90);',
]

# Dávka pre PC pri stroji: prevod .xcs → .pgmx (podľa RUN966.bat).
[xcs.run_bat]
file_name = "RUN.bat"
target_dir = 'C:\Vyroba\CX100'
header = [
    "@Echo Off",
    "Echo Vytvorenie PGMX suborov pre SCM",
]
# Premenné: {input} {output} {stem}
line = 'call "C:\Program Files (x86)\Scm Group\Maestro\XConverter.exe" -s -ow -m 0 -i "{input}" -t "C:\Program Files (x86)\Scm Group\Maestro\Tlgx\COLL.tlgx" -o "{output}" -report'

# ---------------------------------------------------------------------------
# Rozdelenie výroby
#   "cx100"   = diely sa delia na píle, všetko obrábanie dielu ide na CX100 (doterajší postup),
#   "nesting" = obrysy a vŕtanie plochy hore na SCM nestingu, hrany, pílové drážky
#               a spodná plocha na CX100 (findings 08, §3). Vzor: machine-nesting.toml.
# ---------------------------------------------------------------------------
[production]
mode = "cx100"

# ---------------------------------------------------------------------------
# SCM nesting – programy tabúľ (.xcs pre Maestro na nestingu)
#
# Formát podľa programov tabúľ, ktoré dielňa vyrobila na svojom nestingu
# (zákazka REF2026, beh 966: 9660301N, 9660401N, 9680601N).
# Nič z toho ešte nebolo vyskúšané na stroji z CabinetCRAFT → verified = false.
# ---------------------------------------------------------------------------
[nesting]
verified = false                 # hlavička a park – overiť v Maestre pri nestingu
decimals = 4
line_ending = "crlf"
# meno programu tabule: {mat} poradie materiálu, {sheet} poradie tabule (2 číslice), {material}
sheet_name = "{mat}{sheet}N"
# Premenné: {project} {program} {material} {l} {w} {t}
header = [
    "//--PROJEKT: {project}",
    "//--Program: {program}  MATERIAL: {material}",
    "//--Generovane z CabinetCRAFT",
    'SetMachiningParameters("AD",1,10,16973824,false);',   # [P] konštanta nestingu, význam neznámy
    'CreateFinishedWorkpieceBox("Piece",{l},{w},{t});',
    'SetWorkpieceSetupPosition(0,0, 0, 0);',
]
footer = ['CreatePark("Parkovani","Nothing",false);']
# HDF zadné steny sa delia na píle (beh 967 PILA): všetko ich obrábanie ide na CX100
skip_materials = ["HDF_3_biela"]

[nesting.layout]
sheet_length = 2800.0            # [P] tabuľa DTDL/MDF 2800 × 2070, X = dĺžka
sheet_width = 2070.0
margin = 10.0                    # [P] okraj tabule
spacing = 14.2                   # [P] medzera = Ø12 + 2,2

# Iný rozmer tabule pre materiál, napr.:
# [[nesting.sheet]]
# material = "MDF_19_W1000_biela"
# length = 2800.0
# width = 2070.0

# Vŕtanie do plochy hore: iba rovina Top, pred každou dierou výber roviny (ako vo vzoroch).
[nesting.drill]
verified = false
select = 'SelectWorkplane("Top");'
name = "Vrtani {n}"                                  # premenné: {n} {d} {depth}
# premenné: {name} {x} {y} {d} {depth} {tool} {kind}; riadok začína medzerou ako vo vzoroch
line = ' CreateDrill("{name}",{x},{y},{depth},{d},"",TypeOfProcess.Drilling,"{tool}","-1",0,"-1","-1","{kind}",0,0.5);'
default_tool = "-1"              # [P] -1 = nástroj podľa priemeru
default_kind = "P"               # [P] P = plochý vrták
order = [35.0, 8.0, 10.0, 5.0, 4.0, 12.0]   # [P] poradie skupín v programoch tabúľ

[[nesting.drill.variant]]        # [P] značky pre skrutky: hrot Ø4 × 2
diameter = 4.0
max_depth = 2.0
kind = "L"

[[nesting.drill.variant]]        # [P] Ø12 frézou E008 (vrták Ø12 nie je)
diameter = 12.0
tool = "E008"

# Frézovanie obrysov, onion skin a odrezanie zvyšku: fréza E002 Ø12, súsledne (CW, korekcia vľavo).
[nesting.route]
verified = false
tool = "E002"                    # [P] „deliaca“ fréza Ø12
tool_diameter = 12.0
through_extra = 0.2              # [P] prerez = hrúbka + 0,2
skin = 2.0                       # [P] onion skin = hrúbka − 2
small_area = 0.17                # [?] malý diel: plocha < 0,17 m² …
small_min_dim = 120.0            # [?] … alebo menší rozmer < 120 mm
lead_in = 7.0                    # [P] nábeh r + 1
lead_in_depth = -10.0            # [P] prvý bod 10 mm nad materiálom
overlap = 12.0                   # [P] prekrytie = Ø frézy
skin_runout_factor = 2.0         # [P] výbeh onion skinu 2 × (hĺbka + 10)
name = "Frezovani {k} "          # [P] za menom je medzera
first_number = 1001
start = [
    'ResetApproachStrategy();',
    'SelectWorkplane("Top");',
    'SetApproachStrategy(true, false, 2,120);',
]
start_centerline = [
    'ResetApproachStrategy();',
    'SelectWorkplane("Top");',
    'SetApproachStrategy(true, false, 0.5);',
]
first_point = 'CreatePolyline("",{x},{y});'
point = 'AddSegmentToPolyline({x},{y},"");'
depth = 'SetAttribute("DEPTH",{z});'
# premenné: {name} {z} {tool} {comp} {d}
finish = [
    'ResetPneumaticHood();',
    'ResetAuxiliaryHood();',
    'CreateRoughFinish("{name}",{z},"", TypeOfProcess.GeneralRouting ,"{tool}","-1",{comp},{d},"","",0);',
]
comp_outside = "1"               # [P] korekcia vľavo pri obryse v smere hodín
comp_centerline = "0"            # [P] os nástroja

[nesting.remnant]
enabled = true
min_width = 300.0                # [?] zvyšok užší ako 300 mm sa neodrezáva
offset = 8.2                     # [P] os rezu = najvyššia hrana dielov + 6 + 2,2
overrun = 6.0                    # [P] od x = L + 6 po x = −6

# Súpis behu pre obsluhu (UTF-16 LE, CRLF), formát podľa CncRun966.txt.
[nesting.cnc_run]
file_name = "CncRun.txt"
header = [
    "^Job        : {project}",
    "^Description : ",
    "^Date        : ",
    "^Parts       : {parts}",
    "^Sheets      : {sheets}",
]
sheet_line = "{program},Nest Sheet {n},{w},{l},{t},{material},0,1,{grain},{face},0,"
part_line = "{program},{part_id}({code}),{w},{l},{t},{material},{cabinet},1,{grain},{face},0,CX1,CX100                                                       ,"

# ---------------------------------------------------------------------------
# Štítky dielov (findings 14): rozmer štítku v mm a poradie tlače štítkov tabule.
# CV dielne tlačí návrh 80 × 80. Pri inom rozmere sa polia úmerne roztiahnu.
# order: machining (poradie prerezania = číslo na štítku), rows_top_left, columns_left_top,
#        rows_top_right, columns_right_top, rows_bottom_left, columns_left_bottom,
#        rows_bottom_right, columns_right_bottom
# ---------------------------------------------------------------------------
[labels]
width = 80.0
height = 80.0
order = "machining"
offcut_number = true            # odrezaný zvyšok tabule má číslo 1, diely od 2 (ako CV)
# printer = "Zebra ZD421"        # tlačiareň štítkov pre „tlačiť hneď“ (bez = predvolená)
