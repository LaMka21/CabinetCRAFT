# Katalóg „Kuchyne_CASTEL“ – skrinky dielne na pridanie jedným klikom (okno: Skrinky → Katalóg,
# ľavý panel Katalóg, príkaz `cabinet.add {"catalog": "S_KUCH_D", "from": "Kuchyne_CASTEL"}`).
# Vlastné katalógy: v ľavom paneli Katalóg „+ nový“, skrinku zo zákazky ulož tlačidlom
# „Uložiť do katalógu“ (príkazy catalog.create, catalog.save_item).
#
# Označenia a rozmery podľa katalógu dielne v CABINET VISION (Kuchyne_CASTEL) a skriniek,
# ktoré dielňa použila v zákazkách REF2026 a test_1 (findings/10-katalog.md).
#   [P] = zo zákaziek, [K] = z prehľadu katalógu (členenie čiel neoverené), [?] = odhad
# Výška `h` je korpus bez sokla (v CV 862 = 762 + sokel 100). Čelá zhora nadol; čelo bez
# výšky si delí zvyšok. Pánt a zásuvky podľa štandardu dielne, ak tu nie sú.
#
# Zatiaľ chýbajú (CabinetCRAFT ich ešte nevie): BLENDA (čelo s presahom 60 a lišta), DOSKA
# DNO/VRCH, S_RURA_MIKROVLNKA, KRYCI BOK, S_KUCH_RURA; pri VARNA_D kratší chrbát a nižšie vlysy.

